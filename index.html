// Game State global
const gameState={

// Globals requeridos por turn-logic.js
const onlineMode=false,isRoomHost=false;
let currentUser=null;

function normAccent(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}

// Stubs
function pushGameState(){}
function listenGameState(){}

function applyArmadura(n,d){applyBuff(n,{name:'Armadura',type:'buff',duration:d||2,emoji:'🛡️'});}

// Core helpers
function hasStatusEffect(n,eff){
  var c=gameState.characters[n];
  if(!c||!c.statusEffects)return false;
  return c.statusEffects.some(function(e){return e&&normAccent(e.name||'')===normAccent(eff);});
}
function applyBuff(n,data){
  var c=gameState.characters[n];if(!c)return;
  if(!c.statusEffects)c.statusEffects=[];
  c.statusEffects=c.statusEffects.filter(function(e){return!e||e.name!==data.name||e.permanent;});
  c.statusEffects.push(Object.assign({},data));
  if(typeof renderCharacters==='function')renderCharacters();
}
function applyDebuff(n,data){
  var c=gameState.characters[n];if(!c||c.isDead)return;
  if(!c.statusEffects)c.statusEffects=[];
  if(data.name==='Miedo'&&c.immuneToMiedo){addLog('🌟 '+n+' inmune a Miedo','buff');return;}
  if((data.name==='Confusion'||data.name==='Confusión')&&c.immuneToConfusion){addLog('🌟 '+n+' inmune a Confusión','buff');return;}
  c.statusEffects.push(Object.assign({},data));
  if(typeof renderCharacters==='function')renderCharacters();
}
function canHeal(n){
  var c=gameState.characters[n];if(!c)return false;
  return!(c.statusEffects||[]).some(function(e){return e&&normAccent(e.name||'')==='quemadura solar';});
}
function applyHeal(n,amount){
  var c=gameState.characters[n];if(!c||c.isDead)return;
  if(!canHeal(n)){addLog('🚫 '+n+' bloqueado por Quemadura Solar','info');return;}
  var before=c.hp;
  c.hp=Math.min(c.maxHp,(c.hp||0)+amount);
  if(c.hp>before)addLog('💖 '+n+' recupera '+(c.hp-before)+' HP','heal');
  if(typeof renderCharacters==='function')renderCharacters();
}
function applyFlatBurn(n,v,d){applyDebuff(n,{name:'Quemadura',type:'debuff',duration:d||2,flatHp:v,emoji:'🔥'});addLog('🔥 '+n+' Quemadura '+v+'HP '+d+'T','debuff');}
function applyBurn(n,p,d){applyDebuff(n,{name:'Quemadura',type:'debuff',duration:d||2,percent:p,emoji:'🔥'});addLog('🔥 '+n+' Quemadura '+p+'% '+d+'T','debuff');}
function applySolarBurn(n,p,d){applyDebuff(n,{name:'Quemadura Solar',type:'debuff',duration:d||999,percent:p||5,emoji:'☀️'});addLog('☀️ '+n+' Quemadura Solar','debuff');}
function applyPoison(n,v,d){applyDebuff(n,{name:'Veneno',type:'debuff',duration:d||2,flatHp:v,emoji:'☠️'});addLog('☠️ '+n+' Veneno '+v+'HP '+d+'T','debuff');}
function applyFreeze(n,d){applyDebuff(n,{name:'Congelacion',type:'debuff',duration:d||2,emoji:'🧊'});addLog('🧊 '+n+' Congelado','debuff');}
function applyMegaFreeze(n,d){applyDebuff(n,{name:'Mega Congelacion',type:'debuff',duration:d||2,emoji:'🧊'});addLog('🧊 '+n+' Mega Congelado','debuff');}
function applyFear(n,d){applyDebuff(n,{name:'Miedo',type:'debuff',duration:d||2,emoji:'😱'});addLog('😱 '+n+' tiene Miedo','debuff');}
function applyPossession(n){applyDebuff(n,{name:'Posesion',type:'debuff',duration:2,emoji:'👁️'});addLog('👁️ '+n+' Poseído','debuff');}
function applyConfusion(n,d){applyDebuff(n,{name:'Confusion',type:'debuff',duration:d||2,emoji:'🌀'});addLog('🌀 '+n+' Confundido','debuff');}

function processRegenerationEffects(n){
  var c=gameState.characters[n];if(!c||c.isDead)return;
  (c.statusEffects||[]).forEach(function(e){
    if(!e)return;
    var nm=normAccent(e.name||'');
    if(nm==='regeneracion'){if(canHeal(n)){var a=e.percent?Math.ceil(c.maxHp*e.percent/100):(e.flatHp||2);applyHeal(n,a);}}
    if(nm==='quemadura'){var d=e.percent?Math.ceil(c.maxHp*e.percent/100):(e.flatHp||1);c.hp=Math.max(0,c.hp-d);addLog('🔥 '+n+' -'+d+' HP por Quemadura','damage');if(c.hp<=0){c.isDead=true;addLog('💀 '+n+' eliminado por Quemadura','damage');if(typeof onCharacterDeath==='function')onCharacterDeath(n,'Quemadura');}}
    if(nm==='quemadura solar'){var d2=e.percent?Math.ceil(c.maxHp*e.percent/100):(e.flatHp||1);c.hp=Math.max(0,c.hp-d2);addLog('☀️ '+n+' -'+d2+' HP por Q.Solar','debuff');if(c.hp<=0){c.isDead=true;addLog('💀 '+n+' eliminado','damage');if(typeof onCharacterDeath==='function')onCharacterDeath(n,'Q.Solar');}}
    if(nm==='veneno'){var d3=e.flatHp||2;c.hp=Math.max(0,c.hp-d3);addLog('☠️ '+n+' -'+d3+' HP por Veneno','damage');if(c.hp<=0){c.isDead=true;if(typeof onCharacterDeath==='function')onCharacterDeath(n,'Veneno');}}
    if(nm==='sangrado'){var d4=e.flatHp||1;c.hp=Math.max(0,c.hp-d4);addLog('🩸 '+n+' -'+d4+' HP por Sangrado','damage');if(c.hp<=0){c.isDead=true;if(typeof onCharacterDeath==='function')onCharacterDeath(n,'Sangrado');}}
  });
  if(typeof renderCharacters==='function')renderCharacters();
}
function processNewDebuffEffects(n){processRegenerationEffects(n);}
function updateStatusEffectDurations(n){
  var c=gameState.characters[n];if(!c||!c.statusEffects)return;
  c.statusEffects=c.statusEffects.filter(function(e){if(!e||e.permanent)return true;e.duration=(e.duration||1)-1;return e.duration>0;});
  if(typeof renderCharacters==='function')renderCharacters();
}
function onCharacterDeath(n,killer){
  addLog('💀 '+n+' eliminado'+(killer?' por '+killer:''),'damage');
  if(typeof renderCharacters==='function')renderCharacters();
  if(typeof checkGameOver==='function')checkGameOver();
}
function onSummonDeath(){}
function onGameOver(w){setTimeout(function(){_showGameOver(w);},800);}

function checkGameOver(){
  var a1=Object.keys(gameState.characters).filter(function(n){var c=gameState.characters[n];return c&&c.team==='team1'&&!c.isDead&&c.hp>0;});
  var a2=Object.keys(gameState.characters).filter(function(n){var c=gameState.characters[n];return c&&c.team==='team2'&&!c.isDead&&c.hp>0;});
  if(a1.length===0||a2.length===0){
    if(!gameState.gameOver){gameState.gameOver=true;gameState.winner=a1.length>0?'team1':'team2';if(typeof onGameOver==='function')onGameOver(gameState.winner);}
    return true;
  }
  return false;
}

function _showGameOver(w){
  var modal=document.getElementById('gameOverModal');
  var title=document.getElementById('gameOverText');
  var xpDiv=document.getElementById('gameOverXP');
  if(!modal)return;
  title.textContent=w==='team1'?'🏆 VICTORIA — EQUIPO 1':'🏆 VICTORIA — EQUIPO 2';
  title.style.color=w==='team1'?'#00d4ff':'#ff6644';
  var kills1=Object.keys(gameState.characters).filter(function(n){var c=gameState.characters[n];return c&&c.team==='team2'&&c.isDead;}).length;
  var kills2=Object.keys(gameState.characters).filter(function(n){var c=gameState.characters[n];return c&&c.team==='team1'&&c.isDead;}).length;
  var xpLines=[];
  Object.keys(gameState.characters).forEach(function(n){
    var c=gameState.characters[n];if(!c)return;
    var isW=(c.team===w);var kx=c.team==='team1'?kills1:kills2;
    var xp=XPSystem.calcBattleXP(isW,kx);
    XPSystem.giveXP(c.baseName||n,xp);
    var v2=CHARACTERS_V2[c.baseName||n];
    xpLines.push((c.baseName||n)+': +'+xp+' XP'+(v2?' → Nv '+v2.level:''));
  });
  xpDiv.innerHTML='<b style="color:#e8edf5">XP ganada:</b><br>'+xpLines.join('<br>');
  modal.style.display='flex';
  audioManager.stop();
}

// IA simple
function executeAITurn(name){
  var c=gameState.characters[name];if(!c||c.isDead){endTurn();return;}
  setTimeout(function(){
    var abs=c.abilities||[];var chosen=0;
    for(var i=abs.length-1;i>=0;i--){if((c.charges||0)>=(abs[i].cost||0)){chosen=i;break;}}
    selectAbility(name,chosen);
  },900);
}

// Equipos de prueba

function startTestBattle(){

  var chars={};

  TEAM2.forEach(function(n){var v=CHARACTERS_V2[n];if(v)chars[n]=buildCharacterFromV2(n,v,'team2');});
  initGame(chars);
  addLog('⚔️ UNIVERSUS: Battle Collision — Batalla de Prueba iniciada','info');
  addLog('🔷 Equipo 1: '+TEAM1.join(', '),'info');
  addLog('🔶 Equipo 2: '+TEAM2.join(', '),'info');
}

// Modal aprender movimiento
window.showLearnMoveModal=function(charName,newMoves,newPassives){
  var modal=document.getElementById('learnMoveModal');
  var content=document.getElementById('learnMoveContent');
  var v2=CHARACTERS_V2[charName];if(!modal||!content||!v2)return;
  var html='<div style="font-family:Chakra Petch,sans-serif;font-size:.7rem;color:#00d4ff;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;">⬆️ ¡'+charName+' subió de nivel!</div>';
  newMoves.forEach(function(m){
    html+='<div style="background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);border-radius:10px;padding:12px;margin-bottom:10px;">';
    html+='<div style="font-family:Chakra Petch,sans-serif;font-size:.82rem;font-weight:700;color:#e8edf5;margin-bottom:3px;">'+m.name+'</div>';
    html+='<div style="font-size:.73rem;color:#8899bb;margin-bottom:8px;">'+m.description+'</div>';
    html+='<div style="font-size:.68rem;color:#445577;margin-bottom:8px;">Reemplazar un movimiento del pool:</div>';
    (v2.movePool||[]).forEach(function(pid,i){
      var pm=(v2.moves||[]).find(function(x){return x.id===pid;});if(!pm)return;
      html+='<button onclick="confirmLearnMove(\''+charName+'\',\''+m.id+'\','+i+')" style="display:block;width:100%;text-align:left;padding:7px 10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#8899bb;font-size:.72rem;cursor:pointer;font-family:Chakra Petch,sans-serif;margin-bottom:4px;">Slot '+(i+1)+': '+pm.name+' → '+m.name+'</button>';
    });
    html+='<button onclick="skipLearnMove()" style="display:block;width:100%;padding:7px;background:rgba(255,51,102,0.06);border:1px solid rgba(255,51,102,0.2);border-radius:6px;color:#ff3366;font-size:.7rem;cursor:pointer;font-family:Chakra Petch,sans-serif;margin-top:4px;">✕ No aprender</button>';
    html+='</div>';
  });
  newPassives.forEach(function(p){
    html+='<div style="background:rgba(139,92,246,0.07);border:1px solid rgba(139,92,246,0.2);border-radius:10px;padding:12px;margin-bottom:10px;">';
    html+='<div style="font-family:Chakra Petch,sans-serif;font-size:.82rem;font-weight:700;color:#a78bfa;margin-bottom:3px;">Pasiva: '+p.name+'</div>';
    html+='<div style="font-size:.73rem;color:#8899bb;margin-bottom:8px;">'+p.description+'</div>';
    for(var s=0;s<3;s++){
      var curId=(v2.passiveSlots||[])[s];
      var curP=curId?(v2.passives||[]).find(function(x){return x.id===curId;}):null;
      html+='<button onclick="confirmEquipPassive(\''+charName+'\',\''+p.id+'\','+s+')" style="display:block;width:100%;text-align:left;padding:7px 10px;background:rgba(255,255,255,0.03);border:1px solid rgba(139,92,246,0.2);border-radius:6px;color:#8899bb;font-size:.72rem;cursor:pointer;font-family:Chakra Petch,sans-serif;margin-bottom:4px;">Slot '+(s+1)+': '+(curP?curP.name:'Vacío')+' → '+p.name+'</button>';
    }
    html+='<button onclick="skipLearnMove()" style="display:block;width:100%;padding:7px;background:rgba(255,51,102,0.06);border:1px solid rgba(255,51,102,0.2);border-radius:6px;color:#ff3366;font-size:.7rem;cursor:pointer;font-family:Chakra Petch,sans-serif;margin-top:4px;">✕ No equipar</button>';
    html+='</div>';
  });
  content.innerHTML=html;modal.style.display='flex';
};
window.confirmLearnMove=function(name,mid,idx){XPSystem.learnMove(name,mid,idx);document.getElementById('learnMoveModal').style.display='none';addLog('📚 '+name+' aprendió un movimiento','buff');};
window.confirmEquipPassive=function(name,pid,slot){XPSystem.equipPassive(name,pid,slot);document.getElementById('learnMoveModal').style.display='none';addLog('✨ '+name+' equipó una pasiva','buff');};
window.skipLearnMove=function(){document.getElementById('learnMoveModal').style.display='none';};
</script>
